name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0', '8.4']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: commerce_suite_test
        ports:
          - 3306/tcp
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 --silent" --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      COMMERCE_DB_USER: root
      COMMERCE_DB_PASSWORD: ci-test-only
      APP_DEMO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none
      - run: find src public bin views tests database -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run MySQL integration checks
        env:
          COMMERCE_DSN: mysql:host=127.0.0.1;port=${{ job.services.mysql.ports[3306] }};dbname=commerce_suite_test;charset=utf8mb4
        run: |
          if php bin/commerce.php health; then exit 1; fi
          php bin/commerce.php migrate
          php bin/commerce.php migrate
          php bin/commerce.php health
          php tests/integration.php
      - name: Run browser-flow HTTP checks
        env:
          COMMERCE_DSN: mysql:host=127.0.0.1;port=${{ job.services.mysql.ports[3306] }};dbname=commerce_suite_test;charset=utf8mb4
          COMMERCE_SANDBOX_WEBHOOK_SECRET: test-only-commerce-suite-webhook-key
          COMMERCE_SANDBOX_SHIPPING_SECRET: test-only-commerce-suite-shipping-key
          COMMERCE_SANDBOX_REFUND_SECRET: test-only-commerce-suite-refund-key
        run: |
          php -r 'require "src/bootstrap.php"; database()->exec("CREATE DATABASE commerce_suite_web_test CHARACTER SET utf8mb4");'
          export COMMERCE_DSN="${COMMERCE_DSN/commerce_suite_test/commerce_suite_web_test}"
          php -S 127.0.0.1:8080 -t public > /tmp/commerce-web.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in {1..10}; do
            if code=$(curl --silent --max-time 3 http://127.0.0.1:8080/health.php -o /dev/null -w '%{http_code}'); then break; fi
            sleep 1
          done
          test "$code" = 503
          php bin/commerce.php migrate
          php bin/commerce.php seed
          python3 tests/web_smoke.py
  compose:
    runs-on: ubuntu-latest
    env:
      COMMERCE_DB_PASSWORD: test-only-compose-app
      MYSQL_ROOT_PASSWORD: test-only-compose-root
      APP_DEMO: '1'
      COMMERCE_SANDBOX_WEBHOOK_SECRET: test-only-compose-payment-secret-ci
      COMMERCE_SANDBOX_SHIPPING_SECRET: test-only-compose-shipping-secret-ci
      COMMERCE_SANDBOX_REFUND_SECRET: test-only-compose-refund-secret-ci
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --detach --build --wait --wait-timeout 120
      - run: curl --fail --silent http://127.0.0.1:8080/health.php
      - run: docker compose exec -T app php bin/commerce.php seed
      - run: python3 tests/web_smoke.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
