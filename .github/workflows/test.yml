name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql: ['8.0', '8.4']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: commerce_suite_test
        ports:
          - 3306/tcp
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 --silent" --health-interval=5s --health-timeout=3s --health-retries=30
    env:
      COMMERCE_DB_USER: root
      COMMERCE_DB_PASSWORD: ci-test-only
      APP_DEMO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none
      - run: find src public bin views tests database examples -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run MySQL integration checks
        env:
          COMMERCE_DSN: mysql:host=127.0.0.1;port=${{ job.services.mysql.ports[3306] }};dbname=commerce_suite_test;charset=utf8mb4
        run: |
          if php bin/commerce.php health; then exit 1; fi
          php bin/commerce.php migrate
          php bin/commerce.php migrate
          php bin/commerce.php health
          php tests/integration.php
      - name: Run browser-flow HTTP checks
        env:
          COMMERCE_DSN: mysql:host=127.0.0.1;port=${{ job.services.mysql.ports[3306] }};dbname=commerce_suite_test;charset=utf8mb4
          COMMERCE_SANDBOX_WEBHOOK_SECRET: test-only-commerce-suite-webhook-key
          COMMERCE_SANDBOX_SHIPPING_SECRET: test-only-commerce-suite-shipping-key
          COMMERCE_SANDBOX_REFUND_SECRET: test-only-commerce-suite-refund-key
          COMMERCE_FREIGHT_EXTENSION: ${{ github.workspace }}/examples/freight-consolidation.php
          COMMERCE_PROMOTION_EXTENSION: ${{ github.workspace }}/examples/promotion-steps.php
        run: |
          php -r 'require "src/bootstrap.php"; database()->exec("CREATE DATABASE commerce_suite_web_test CHARACTER SET utf8mb4");'
          export COMMERCE_DSN="${COMMERCE_DSN/commerce_suite_test/commerce_suite_web_test}"
          php -S 127.0.0.1:8080 -t public > /tmp/commerce-web.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in {1..10}; do
            if code=$(curl --silent --max-time 3 http://127.0.0.1:8080/health.php -o /dev/null -w '%{http_code}'); then break; fi
            sleep 1
          done
          test "$code" = 503
          php bin/commerce.php migrate
          php bin/commerce.php seed
          python3 tests/web_smoke.py
      - name: Run catalog channel HTTP checks
        env:
          COMMERCE_DSN: mysql:host=127.0.0.1;port=${{ job.services.mysql.ports[3306] }};dbname=commerce_suite_test;charset=utf8mb4
          COMMERCE_PAYMENT_EXTENSION: ${{ github.workspace }}/examples/payment-bridge.php
          COMMERCE_CHECKOUT_CHANNEL: bridge_v1
          COMMERCE_BRIDGE_CHECKOUT_URL: https://checkout.example.test/pay
          COMMERCE_BRIDGE_CHECKOUT_SECRET: test-only-bridge-checkout-signing-key
          COMMERCE_BRIDGE_WEBHOOK_SECRET: test-only-bridge-receipt-signing-key
        run: |
          php -r 'require "src/bootstrap.php"; database()->exec("CREATE DATABASE commerce_catalog_test CHARACTER SET utf8mb4");'
          export COMMERCE_DSN="${COMMERCE_DSN/commerce_suite_test/commerce_catalog_test}"
          php bin/commerce.php migrate
          php bin/commerce.php seed
          export APP_DEMO=0
          php -S 127.0.0.1:8080 -t public > /tmp/commerce-catalog.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8080/health.php; then break; fi
            sleep 1
          done
          python3 tests/catalog_channel_web.py
      - name: Run payment channel and carrier HTTP checks
        env:
          COMMERCE_DSN: mysql:host=127.0.0.1;port=${{ job.services.mysql.ports[3306] }};dbname=commerce_suite_test;charset=utf8mb4
          COMMERCE_PAYMENT_EXTENSION: ${{ github.workspace }}/examples/payment-bridge.php
          COMMERCE_CHECKOUT_CHANNEL: bridge_v1
          COMMERCE_BRIDGE_CHECKOUT_URL: https://checkout.example.test/pay
          COMMERCE_BRIDGE_CHECKOUT_SECRET: test-only-bridge-checkout-signing-key
          COMMERCE_BRIDGE_WEBHOOK_SECRET: test-only-bridge-receipt-signing-key
          COMMERCE_CARRIER_EXTENSION: ${{ github.workspace }}/examples/carrier-bridge.php
          COMMERCE_CARRIER_WEBHOOK_SECRET: test-only-carrier-event-signing-key
        run: |
          php -r 'require "src/bootstrap.php"; database()->exec("CREATE DATABASE commerce_bridge_test CHARACTER SET utf8mb4");'
          export COMMERCE_DSN="${COMMERCE_DSN/commerce_suite_test/commerce_bridge_test}"
          php bin/commerce.php migrate
          php bin/commerce.php seed
          export APP_DEMO=0
          php -S 127.0.0.1:8080 -t public > /tmp/commerce-bridge.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8080/health.php; then break; fi
            sleep 1
          done
          python3 tests/payment_channel_web.py
          python3 tests/carrier_web.py
  compose:
    runs-on: ubuntu-latest
    env:
      COMMERCE_DB_PASSWORD: test-only-compose-app
      MYSQL_ROOT_PASSWORD: test-only-compose-root
      APP_DEMO: '1'
      COMMERCE_SANDBOX_WEBHOOK_SECRET: test-only-compose-payment-secret-ci
      COMMERCE_SANDBOX_SHIPPING_SECRET: test-only-compose-shipping-secret-ci
      COMMERCE_SANDBOX_REFUND_SECRET: test-only-compose-refund-secret-ci
      COMMERCE_FREIGHT_EXTENSION: /app/examples/freight-consolidation.php
      COMMERCE_PROMOTION_EXTENSION: /app/examples/promotion-steps.php
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --detach --build --wait --wait-timeout 120
      - run: curl --fail --silent http://127.0.0.1:8080/health.php
      - run: docker compose exec -T app php bin/commerce.php seed
      - run: python3 tests/web_smoke.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
