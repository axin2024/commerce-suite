x-commerce: &commerce
  build: .

x-database: &database
  COMMERCE_DSN: mysql:host=db;dbname=commerce_suite;charset=utf8mb4
  COMMERCE_DB_USER: commerce
  COMMERCE_DB_PASSWORD: ${COMMERCE_DB_PASSWORD:?set COMMERCE_DB_PASSWORD}

services:
  migrate:
    <<: *commerce
    command: ["php", "bin/commerce.php", "migrate"]
    environment: *database
    depends_on:
      db:
        condition: service_healthy
  app:
    <<: *commerce
    init: true
    restart: unless-stopped
    environment:
      <<: *database
      APP_DEMO: ${APP_DEMO:-0}
      COMMERCE_SECURE_COOKIES: ${COMMERCE_SECURE_COOKIES:-0}
      COMMERCE_FREIGHT_EXTENSION: ${COMMERCE_FREIGHT_EXTENSION:-}
      COMMERCE_PROMOTION_EXTENSION: ${COMMERCE_PROMOTION_EXTENSION:-}
      COMMERCE_PAYMENT_EXTENSION: ${COMMERCE_PAYMENT_EXTENSION:-}
      COMMERCE_CHECKOUT_CHANNEL: ${COMMERCE_CHECKOUT_CHANNEL:-}
      COMMERCE_BRIDGE_CHECKOUT_URL: ${COMMERCE_BRIDGE_CHECKOUT_URL:-}
      COMMERCE_BRIDGE_CHECKOUT_SECRET: ${COMMERCE_BRIDGE_CHECKOUT_SECRET:-}
      COMMERCE_BRIDGE_WEBHOOK_SECRET: ${COMMERCE_BRIDGE_WEBHOOK_SECRET:-}
      COMMERCE_CARRIER_EXTENSION: ${COMMERCE_CARRIER_EXTENSION:-}
      COMMERCE_CARRIER_WEBHOOK_SECRET: ${COMMERCE_CARRIER_WEBHOOK_SECRET:-}
      COMMERCE_SANDBOX_WEBHOOK_SECRET: ${COMMERCE_SANDBOX_WEBHOOK_SECRET:-}
      COMMERCE_SANDBOX_SHIPPING_SECRET: ${COMMERCE_SANDBOX_SHIPPING_SECRET:-}
      COMMERCE_SANDBOX_REFUND_SECRET: ${COMMERCE_SANDBOX_REFUND_SECRET:-}
    ports:
      - "127.0.0.1:${COMMERCE_HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health.php') === false ? 1 : 0);"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
  worker:
    <<: *commerce
    command: ["php", "bin/worker.php"]
    init: true
    restart: unless-stopped
    environment:
      <<: *database
      COMMERCE_WORK_INTERVAL_SECONDS: ${COMMERCE_WORK_INTERVAL_SECONDS:-60}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  db:
    image: ${COMMERCE_MYSQL_IMAGE:-mysql:8.4}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: commerce_suite
      MYSQL_USER: commerce
      MYSQL_PASSWORD: ${COMMERCE_DB_PASSWORD:?set COMMERCE_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    volumes:
      - commerce-data:/var/lib/mysql
volumes:
  commerce-data:
